one_wire:
  - platform: gpio
    pin: GPIO19

i2c:
  sda: GPIO21
  scl: GPIO22

binary_sensor:
  - platform: template
    name: "Engine Active"
    id: engine_active
    device_class: "running"
    trigger_on_initial_state: true
    icon: "mdi:engine"
    lambda: |-
      return id(rev_counter).state > 100;

sensor:
  - platform: pulse_counter
    pin: 18
    name: "Engine Tacho"
    id: rev_counter
    icon: "mdi:speedometer"
    device_class: frequency
    state_class: measurement
    unit_of_measurement: 'rpm'
    accuracy_decimals: 0
    update_interval: 2s
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0 -> 900
            - 15200 -> 1000
            - 18200 -> 1200
            - 21100 -> 1400
            - 24000 -> 1600
    on_value:
      - signalk.publish_delta:
          path: propulsion.engine.revolutions
          unit: "rotations_per_minute"
          meta:
            displayName: "Tachometer"
            longName: "Tachometer"
            shortName: "Tacho"
            description: "Engine revolutions (x60 for RPM)"
            units: "Hz"
            timeout: 1
            displayScale:
              lower: 0
              upper: 75
              type: linear
            alertMethod: ["visual"]
            warnMethod: ["visual"]
            alarmMethod: ["sound", "visual"]
            emergencyMethod: ["sound", "visual"]
            zones:
              - upper: 4
                state: alarm
                message: "Stopped or very slow"
              - lower: 4
                upper: 60
                state: normal
              - lower: 60
                upper: 65
                state: warn
                message: "Approaching maximum"
              - lower: 65
                state: alarm
                message: "Exceeding maximum"

  - platform: template
    name: "Engine Active Numeric"
    id: engine_active_numeric
    lambda: |-
      return id(engine_active).state ? 1.0 : 0.0;
    update_interval: 1s

  - platform: integration
    name: "Engine Hours"
    id: engine_hours
    sensor: engine_active_numeric
    accuracy_decimals: 1
    state_class: "TOTAL_INCREASING"
    time_unit: h
    restore: true
    icon: "mdi:timer"
    filters:
      - heartbeat: 2s
    on_value:
      - signalk.publish_delta:
          path: propulsion.engine.hours
          unit: "hours"

  - platform: integration
    name: "Time Since Last Oil Change"
    id: time_since_last_oil_change
    sensor: engine_active_numeric
    accuracy_decimals: 1
    state_class: "TOTAL_INCREASING"
    time_unit: h
    restore: true
    icon: "mdi:timer"
    filters:
      - heartbeat: 60s
    on_value:
      - signalk.publish_delta:
          path: propulsion.engine.service.oilchange
          unit: "hours"

  - platform: integration
    name: "Time Since Last Coolant Change"
    id: time_since_last_coolant_change
    sensor: engine_active_numeric
    accuracy_decimals: 1
    state_class: "TOTAL_INCREASING"
    time_unit: h
    restore: true
    icon: "mdi:timer"
    filters:
      - heartbeat: 60s
    on_value:
      - signalk.publish_delta:
          path: propulsion.engine.service.coolantchange
          unit: "hours"

  - platform: dallas_temp
    name: exhaustTemperature
    update_interval: 1s
    address: 0x4a000000bb004f28
    on_value:
      - signalk.publish_delta:
          path: propulsion.engine.exhaust.temperature
          unit: "celsius"
          meta:
            displayName: "Exhaust Temperature"
            longName: "Exhaust Temperature"
            shortName: "Exhaust"
            description: "Exhaust gas temperature"

  - platform: ina219
    # address: 0x40
    # shunt_resistance: 0.1 ohm
    id: oil_sender
    bus_voltage:
      name: "oil_sender_voltage"
      id: oil_sender_voltage
    # max_voltage: 32.0V
    # max_current: 3.2A
    update_interval: 5s

button:
  - platform: template
    name: "Reset Oil Change"
    on_press:
      - sensor.integration.reset: time_since_last_oil_change

  - platform: template
    name: "Reset Coolant Change"
    on_press:
      - sensor.integration.reset: time_since_last_coolant_change

