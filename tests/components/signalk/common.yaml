substitutions:
  name: signalk-test
  friendly_name: "SignalK Test"
  wifi_ssid: "test_ssid"
  wifi_password: "test_password"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - signalk.publish_delta:
          id: signalk_main
          path: "environment.temperature"
          value: 21.5
          unit: "celsius"
          meta:
            displayName: "Outside temperature"
            zones:
              - upper: 273.15
                state: alarm
                message: "Freezing"
      - signalk.put_request:
          id: signalk_main
          path: "steering.autopilot.actions.adjustHeading"
          value: -10

external_components:
  - source:
      type: local
      path: ../../../components
    components: [signalk]

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

logger:

api:

signalk:
  id: signalk_main
  host: "127.0.0.1"
  port: 3000
  source: "esphome.signalk-test"
  # Publish the paths handled with on_put, so that the server forwards their PUTs here.
  on_connect:
    - signalk.publish_delta:
        id: signalk_main
        path: "test.put.steps"
        value: 0.0
  on_put:
    - path: "test.put.steps"
      type: number
      then:
        - if:
            condition:
              lambda: "return x > 100;"
            then:
              - signalk.put_reply:
                  id: signalk_main
                  request_id: !lambda "return request_id;"
                  status_code: 400
                  message: "Too many"
    - path: "test.put.mode"
      type: boolean
      reply: manual
      then:
        - delay: 100ms
        - signalk.put_reply:
            id: signalk_main
            request_id: !lambda "return request_id;"
            message: !lambda 'return x ? std::string("on") : std::string("off");'
    - path: "test.put.heading"
      type: number
      unit: degrees
      then:
        - logger.log:
            format: "heading %.1f"
            args: [x]
    - path: "test.put.command"
      then:
        - logger.log:
            format: "command %s"
            args: [x.c_str()]

sensor:
  - platform: signalk
    id: environment_wind_speed_app
    path: environment.wind.speedApparent
    unit: "knots"
    meta:
      displayName: "Apparent wind"
      timeout: 2
      displayScale:
        lower: 0
        upper: 40
        type: linear
      alarmMethod: [sound, visual]
      zones:
        - upper: 25
          state: normal
        - lower: 25
          state: alarm
          message: "Too windy"

text_sensor:
  - platform: signalk
    id: navigation_position
    path: navigation.position
    meta:
      description: "Vessel position"

switch:
  - platform: signalk
    id: cabin_lights
    path: electrical.switches.test.state
    meta:
      shortName: "Cabin"

number:
  - platform: signalk
    id: steering_target
    path: steering.autopilot.target
    unit: "degrees"
    meta:
      description: "Autopilot target heading"
    min: 0
    max: 360

text:
  - platform: signalk
    id: nav_state
    path: navigation.state
    meta:
      longName: "Navigation state"
    mode: text

button:
  # A node without a display: forget the server (with host set, as here, it does nothing).
  - platform: template
    name: "Forget SignalK server"
    on_press:
      - signalk.forget_server: signalk_main
